
<header class="border-b border-[#E8E1D8] bg-[#FAF7F2]">
  <div class="mx-auto flex max-w-7xl items-center gap-6 px-6 py-4">


<!-- Logo -->
<a
  routerLink="/"
  class="flex shrink-0 items-center gap-2 font-serif text-2xl font-bold text-[#14213A]">

  <img
    src="/images/craftbridge-logo.svg"
    alt=""
    class="h-10 w-10"
  />

  <span>CraftBridge</span>
</a>


    <!-- Desktop Navigation -->
    <nav class="hidden items-center gap-6 text-sm font-medium text-[#14213A] lg:flex">
      <a routerLink="/shop" class="hover:text-[#B6502C]">Shop</a>
      <a routerLink="/shop" class="hover:text-[#B6502C]">Categories</a>
      <a routerLink="/shop" class="hover:text-[#B6502C]">Artisans</a>
      <a href="#about" class="hover:text-[#B6502C]">About</a>
    </nav>

    <!-- Search -->
    <form
      (ngSubmit)="searchProducts()"
      class="hidden flex-1 items-center rounded-full border border-[#E8E1D8] bg-white px-4 py-2 md:flex">

      <input
        type="search"
        name="search"
        [(ngModel)]="searchQuery"
        placeholder="Search handmade products, artisans, or stories..."
        aria-label="Search handmade products"
        class="w-full bg-transparent text-sm text-[#14213A] outline-none"
      />

      <button type="submit" aria-label="Search" class="text-[#B6502C]">
        Search
      </button>
    </form>

    <!-- Actions -->
    <div class="ml-auto flex items-center gap-4 text-[#14213A]">
      <a routerLink="/wishlist" aria-label="Wishlist" class="text-xl">♡</a>
      <a [routerLink]="auth.isLoggedIn() ? '/account/profile' : '/login'" aria-label="Account" class="text-xl">♙</a>
      <a routerLink="/cart" aria-label="Cart" class="text-xl">🛒</a>

      <a
        routerLink="/register"
        class="hidden rounded-md bg-[#B6502C] px-4 py-2 text-xs font-semibold text-white hover:bg-[#994022] xl:inline-flex">
        Sell on CraftBridge
      </a>

      <button
        type="button"
        class="text-2xl lg:hidden"
        aria-label="Toggle menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()">
        ☰
      </button>
    </div>
  </div>

  <!-- Mobile Navigation -->
  @if (menuOpen()) {
    <nav class="flex flex-col gap-4 border-t border-[#E8E1D8] px-6 py-5 lg:hidden">
      <a routerLink="/" (click)="closeMenu()">Home</a>
      <a routerLink="/shop" (click)="closeMenu()">Shop</a>
      <a routerLink="/shop" (click)="closeMenu()">Categories</a>
      <a routerLink="/shop" (click)="closeMenu()">Artisans</a>
    </nav>
  }
</header>
