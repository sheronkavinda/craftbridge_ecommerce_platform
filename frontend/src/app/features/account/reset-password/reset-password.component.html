<main class="flex min-h-[calc(100vh-82px)] items-center justify-center bg-[#F7F3EE] px-6">
  <form [formGroup]="form" (ngSubmit)="submit()" class="w-full max-w-md rounded-2xl bg-white p-8 shadow-sm">
    <h1 class="font-serif text-3xl font-bold text-[#14213A]">Choose a new password</h1>
    <input formControlName="password" type="password" autocomplete="new-password"
      placeholder="New password" class="mt-6 w-full rounded-md border border-[#D9D1C5] px-4 py-3" />
    @if (message) { <p role="alert" class="mt-4 text-sm text-red-700">{{ message }}</p> }
    <button type="submit" [disabled]="loading" class="mt-5 w-full rounded-md bg-[#B6502C] px-5 py-3 font-semibold text-white disabled:opacity-60">
      {{ loading ? 'Resetting...' : 'Reset password' }}
    </button>
  </form>
</main>
