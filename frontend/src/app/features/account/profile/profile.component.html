<main class="mx-auto min-h-[calc(100vh-82px)] max-w-3xl px-6 py-12">
  <nav class="mb-6 flex gap-5 text-sm">
    <a routerLink="/account/profile" class="font-semibold text-[#B6502C]">Profile</a>
    <a routerLink="/account/addresses" class="text-[#526071]">Addresses</a>
    <button type="button" class="ml-auto text-[#526071] hover:text-[#B6502C]" (click)="logout()">Sign out</button>
  </nav>
  @if (loading) {
    <p role="status" class="rounded-xl bg-white p-8 text-[#526071]">Loading your profile...</p>
  } @else {
  <form [formGroup]="form" (ngSubmit)="submit()" class="rounded-2xl border border-[#E8E1D8] bg-white p-8">
    <h1 class="font-serif text-3xl font-bold text-[#14213A]">Profile & security</h1>
    <label class="mt-6 block text-sm font-semibold">Full name
      <input formControlName="name" class="mt-2 w-full rounded-md border px-4 py-3" />
    </label>
    <label class="mt-5 block text-sm font-semibold">Email
      <input formControlName="email" class="mt-2 w-full rounded-md border bg-gray-50 px-4 py-3" />
    </label>
    @if (message) { <p role="status" class="mt-4 text-sm text-green-700">{{ message }}</p> }
    @if (error) { <p role="alert" class="mt-4 text-sm text-red-700">{{ error }}</p> }
    <button type="submit" [disabled]="saving" class="mt-6 rounded-md bg-[#B6502C] px-6 py-3 font-semibold text-white disabled:opacity-60">
      {{ saving ? 'Saving...' : 'Save changes' }}
    </button>
  </form>
  }
</main>
