<main class="flex min-h-[calc(100vh-82px)] items-center justify-center bg-[#F7F3EE] px-6">
  <form [formGroup]="form" (ngSubmit)="submit()" class="w-full max-w-md rounded-2xl bg-white p-8 shadow-sm">
    <h1 class="font-serif text-3xl font-bold text-[#14213A]">Reset your password</h1>
    <p class="mt-3 text-sm text-gray-600">Enter your email to request a password reset.</p>
    <input formControlName="email" type="email" placeholder="Email"
      class="mt-6 w-full rounded-md border border-[#D9D1C5] px-4 py-3" />
    @if (message) { <p role="status" class="mt-4 text-sm text-green-700">{{ message }}</p> }
    @if (error) { <p role="alert" class="mt-4 text-sm text-red-700">{{ error }}</p> }
    <button type="submit" [disabled]="loading" class="mt-5 w-full rounded-md bg-[#B6502C] px-5 py-3 font-semibold text-white disabled:opacity-60">
      {{ loading ? 'Sending...' : 'Send reset request' }}
    </button>
    <a routerLink="/login" class="mt-4 block text-center text-sm text-[#B6502C]">Back to sign in</a>
  </form>
</main>
